<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard en tiempo real de los métodos más minados en GitHub">
    <title>GitHub Code Miner - Top Palabras</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Code Miner <span>Live Analytics</span></h1>
            <p>Monitoreo en tiempo real de funciones y métodos en repositorios populares de Python y Java.</p>
        </header>
        
        <div class="controls">
            <label for="topN">Mostrar Top:</label>
            <select id="topN">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
            </select>
        </div>

        <div class="chart-container">
            <canvas id="rankingChart"></canvas>
        </div>
    </div>
    
    <!-- Librería Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
