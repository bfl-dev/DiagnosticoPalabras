services:
  redis:
    image: redis:alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    restart: always

  miner:
    build:
      context: ./miner
    container_name: github_miner
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    restart: always

  visualizer:
    build:
      context: ./visualizer
    container_name: github_visualizer
    ports:
      - "3000:3000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    restart: always
